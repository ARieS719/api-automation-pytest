version: '3.8'

services:
  mock-api:
    build: .
    container_name: qa_mock_server
    ports:
      - "8000:8000"
    environment:
      - ENV=DOCKER_QA
      - BASE_URL=http://localhost:8000
      # 【核心魔法 1】：让服务器把数据库建在这个特殊的 shared_data 文件夹里
      - DB_NAME=/app/shared_data/test_business.db
    # 【核心魔法 2】：把下面声明的共享 U 盘，插到容器的 /app/shared_data 目录
    volumes:
      - qa-shared-data:/app/shared_data
    restart: always

  test-runner:
    build: .
    container_name: qa_test_runner
    command: sh -c "sleep 5 && pytest tests/ -s"
    depends_on:
      - mock-api
    environment:
      - ENV=DOCKER_QA
      - BASE_URL=http://mock-api:8000
      # 【核心魔法 3】：让测试脚本也去这个特殊的 shared_data 文件夹里读数据库
      - DB_NAME=/app/shared_data/test_business.db
    # 【核心魔法 4】：把同一块共享 U 盘，也插到测试机里，实现文件互通！
    volumes:
      - qa-shared-data:/app/shared_data

  # 新增的测试数据库服务 (必须放在 services 这个大层级下面)
  test-db:
    image: mysql:8.0
    container_name: qa_automation_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass     # Root 密码
      - MYSQL_DATABASE=automation_shop    # 启动时自动创建的测试库名
      - MYSQL_USER=qa_user                # 分配给自动化脚本的专属账号
      - MYSQL_PASSWORD=qa_pass            # 专属账号密码
    ports:
      - "3306:3306"                       # 将容器内部的 3306 端口映射到你电脑本地
    volumes:
      # 极其关键的一步：容器启动时，会自动执行 db_init 目录下的 sql 脚本
      - ./db_init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis-cache:
    image: redis:7.0-alpine
    container_name: automation_redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass qa_redis_pass
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "qa_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

# 【核心魔法 5】：向 Docker 申请一块名字叫 qa-shared-data 的虚拟共享磁盘
# 注意这里 volumes 下面只能放磁盘的名字，不能放服务
volumes:
  qa-shared-data: