version: '3.8'

services:
  mock-api:
    build: .
    container_name: qa_mock_server
    ports:
      - "8000:8000"
    environment:
      - ENV=DOCKER_QA
      - BASE_URL=http://localhost:8000
    restart: always
    # 【修复】：去掉了 volumes 映射，让 sqlite 和 logs 直接在容器内部自动生成，互不干扰！

  test-runner:
    build: .
    container_name: qa_test_runner
    command: pytest tests/ -s
    depends_on:
      - mock-api
    environment:
      - ENV=DOCKER_QA
      - BASE_URL=http://mock-api:8000
      - DB_NAME=test_business.db
    # 【修复】：同样去掉了这里的 volumes 映射