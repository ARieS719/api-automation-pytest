name: 🚀 QA Enterprise Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 1. 拉取最新代码
        uses: actions/checkout@v4

      - name: 🐳 2. 一键拉起容器化测试矩阵 (Docker Compose V2)
        # 【核心修复】：去掉横杠！使用现代化的 docker compose 命令
        run: |
          docker compose up --build --exit-code-from test-runner