name: API Automation CI

# 触发条件：当代码被 push 到 main 分支时自动执行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # 告诉 GitHub 给我分配一台最新的 Ubuntu Linux 虚拟机
    runs-on: ubuntu-latest

    steps:
    - name: 1. 拉取仓库代码
      uses: actions/checkout@v4

    - name: 2. 安装 Python 3.11 环境
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip' # 自动缓存依赖，加快后续运行速度

    - name: 3. 安装项目依赖库
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 4. 后台启动 Mock 业务服务器
      # 核心技术点：在命令最后加个 '&' 表示在后台运行，否则终端会被卡死
      # 启动后 sleep 3 秒，等服务器完全起好，再去跑测试
      run: |
        uvicorn mock_server.app:app &
        sleep 3 

    - name: 5. 运行全局接口自动化测试
      run: |
        pytest tests/ -s